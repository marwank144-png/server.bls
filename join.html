<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>انضمام إلى الجلسة</title>
    <style>
        body { font-family: 'Tajawal', Arial, sans-serif; padding: 20px; background: #f4f4f4; text-align: center; }
        h1 { color: #007bff; }
        p { font-size: 1.2em; }
        #status { color: #dc3545; }
        .loader { margin: 20px auto; border: 8px solid #f3f3f3; border-top: 8px solid #007bff; border-radius: 50%; width: 60px; height: 60px; animation: spin 1.5s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>جاري الانضمام إلى الجلسة...</h1>
    <div id="status"></div>
    <div class="loader"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code')?.toUpperCase();
        const statusDiv = document.getElementById('status');

        if (code) {
            statusDiv.textContent = `جاري الاقتران بالرمز ${code}...`;
            const ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => ws.send(JSON.stringify({ type: 'join-session', code: code }));

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                switch (message.type) {
                    case 'session-paired':
                        statusDiv.textContent = '✅ تم الاقتران! في انتظار بيانات المزامنة...';
                        break;
                    case 'sync-data':
                        statusDiv.textContent = '✅ تم الاستلام! جاري إعادة توجيهك الآن...';
                        // إعادة التوجيه إلى بداية مسار الـ Proxy
                        window.location.href = `/${code}/`; //  <-- التغيير المهم هنا
                        break;
                    case 'session-error':
                        statusDiv.textContent = `❌ خطأ: ${message.message}`;
                        break;
                }
            };

            ws.onclose = () => statusDiv.textContent = '❌ انقطع الاتصال.';
            ws.onerror = () => statusDiv.textContent = '❌ خطأ في الاتصال.';
        } else {
            statusDiv.textContent = '❌ لم يتم العثور على رمز.';
        }
    </script>
</body>
</html>
